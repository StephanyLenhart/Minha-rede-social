<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialHub - Rede Social Moderna</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #f59e0b;
            --bg-dark: #0f172a;
            --bg-light: #1e293b;
            --card-bg: #1e293b;
            --border: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1f3a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-icons {
            display: flex;
            gap: 20px;
            font-size: 18px;
            cursor: pointer;
        }

        .header-icons i {
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }

        .header-icons i:hover {
            color: var(--primary);
            transform: scale(1.1);
        }

        /* Navigation */
        nav {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0;
            position: sticky;
            top: 60px;
            z-index: 99;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            color: var(--primary);
        }

        .nav-btn.active {
            color: var(--primary);
        }

        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
        }

        /* Main Container */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Sections */
        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Feed Section */
        .feed-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }

        /* Post Creator */
        .post-creator {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .creator-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .creator-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            flex-shrink: 0;
        }

        textarea {
            width: 100%;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            color: var(--text-primary);
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.8);
        }

        textarea::placeholder {
            color: var(--text-secondary);
        }

        .creator-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .creator-actions button {
            flex: 1;
            min-width: 100px;
            background: none;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .creator-actions button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .post-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .post-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        /* Post */
        .post {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .post:hover {
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.1);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .post-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        .post-user-info h3 {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
        }

        .post-user-info p {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0;
        }

        .post-menu {
            cursor: pointer;
            font-size: 18px;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .post-menu:hover {
            color: var(--primary);
        }

        .post-image {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3) 0%, rgba(236, 72, 153, 0.3) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 60px;
            background-size: cover;
            background-position: center;
        }

        .post-actions {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .action-group {
            display: flex;
            gap: 15px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            padding: 5px;
        }

        .action-btn:hover {
            color: var(--primary);
            transform: scale(1.2);
        }

        .action-btn.liked {
            color: var(--secondary);
        }

        .post-stats {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
        }

        .likes {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .post-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .post-content {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            line-height: 1.5;
        }

        .post-comments {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
        }

        .comment {
            margin-bottom: 8px;
            font-size: 13px;
        }

        .comment strong {
            font-weight: 600;
            color: var(--primary);
        }

        .comment-input {
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .comment-input input {
            flex: 1;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.5);
            outline: none;
            font-size: 13px;
            font-family: inherit;
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .comment-input button {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
            padding: 0;
            transition: all 0.3s ease;
        }

        .comment-input button:hover {
            color: var(--secondary);
        }

        /* Sidebar */
        .sidebar {
            position: sticky;
            top: 140px;
            height: fit-content;
        }

        .sidebar-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            margin-bottom: 8px;
        }

        .sidebar-item:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .sidebar-item-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            flex-shrink: 0;
        }

        .sidebar-item-name {
            font-size: 14px;
            font-weight: 500;
        }

        /* Stories Section */
        .stories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        .story-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            aspect-ratio: 9/16;
            position: relative;
        }

        .story-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        .story-image {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3) 0%, rgba(236, 72, 153, 0.3) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: var(--text-secondary);
            background-size: cover;
            background-position: center;
        }

        .story-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.9), transparent);
            padding: 15px;
            color: white;
        }

        .story-info h4 {
            font-size: 13px;
            font-weight: 600;
            margin: 0;
        }

        .story-info p {
            font-size: 11px;
            color: var(--text-secondary);
            margin: 0;
        }

        /* Story Viewer Modal */
        .story-viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .story-viewer.active {
            display: flex;
        }

        .story-viewer-content {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 9/16;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.5) 0%, rgba(236, 72, 153, 0.5) 100%);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            background-size: cover;
            background-position: center;
        }

        .story-viewer-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .story-viewer-close:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .story-viewer-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .story-viewer-nav:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .story-viewer-nav.prev {
            left: 20px;
        }

        .story-viewer-nav.next {
            right: 20px;
        }

        /* Profile Section */
        .profile-header {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 30px;
            text-align: center;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 50px;
            margin: 0 auto 20px;
        }

        .profile-header h2 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .profile-header p {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .profile-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .profile-actions button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .profile-actions button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .profile-posts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .profile-post {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 1;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .profile-post:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .feed-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 20px;
            }

            .nav-container {
                gap: 15px;
            }

            .nav-btn {
                padding: 12px 15px;
                font-size: 14px;
            }

            .post-image {
                height: 250px;
            }

            .profile-header {
                padding: 25px;
            }

            .profile-avatar {
                width: 80px;
                height: 80px;
                font-size: 35px;
            }

            .profile-stats {
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1><i class="fas fa-rocket"></i> SocialHub</h1>
        <div class="header-icons">
            <i class="fas fa-bell" title="Notificações"></i>
            <i class="fas fa-envelope" title="Mensagens"></i>
        </div>
    </header>

    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <button class="nav-btn active" onclick="switchSection('feed')">
                <i class="fas fa-home"></i> Feed
            </button>
            <button class="nav-btn" onclick="switchSection('stories')">
                <i class="fas fa-image"></i> Stories
            </button>
            <button class="nav-btn" onclick="switchSection('profile')">
                <i class="fas fa-user"></i> Perfil
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="main-container">

        <!-- Feed Section -->
        <div id="feed" class="section active">
            <div class="feed-container">
                <!-- Feed -->
                <div>
                    <!-- Post Creator -->
                    <div class="post-creator">
                        <div class="creator-header">
                            <div class="creator-avatar">V</div>
                            <textarea id="post-input" rows="1" placeholder="No que você está pensando?"></textarea>
                        </div>
                        <div class="creator-actions">
                            <button><i class="fas fa-image"></i> Foto</button>
                            <button><i class="fas fa-video"></i> Vídeo</button>
                            <button><i class="fas fa-smile"></i> Sentimento</button>
                        </div>
                        <button class="post-btn" onclick="addPost()">Publicar</button>
                    </div>

                    <!-- Feed de Posts -->
                    <div id="feed-posts">
                        <!-- Posts aparecerão aqui -->
                    </div>
                </div>

                <!-- Sidebar -->
                <div class="sidebar">
                    <div class="sidebar-card">
                        <div class="sidebar-title">Sugestões para você</div>
                        <div class="sidebar-item">
                            <div class="sidebar-item-icon"><i class="fas fa-user"></i></div>
                            <div class="sidebar-item-name">João Silva</div>
                        </div>
                        <div class="sidebar-item">
                            <div class="sidebar-item-icon"><i class="fas fa-user"></i></div>
                            <div class="sidebar-item-name">Maria Oliveira</div>
                        </div>
                        <div class="sidebar-item">
                            <div class="sidebar-item-icon"><i class="fas fa-user"></i></div>
                            <div class="sidebar-item-name">Pedro Santos</div>
                        </div>
                    </div>

                    <div class="sidebar-card">
                        <div class="sidebar-title">Trending</div>
                        <div class="sidebar-item">
                            <div class="sidebar-item-icon"><i class="fas fa-fire"></i></div>
                            <div class="sidebar-item-name">#WebDevelopment</div>
                        </div>
                        <div class="sidebar-item">
                            <div class="sidebar-item-icon"><i class="fas fa-fire"></i></div>
                            <div class="sidebar-item-name">#Design</div>
                        </div>
                        <div class="sidebar-item">
                            <div class="sidebar-item-icon"><i class="fas fa-fire"></i></div>
                            <div class="sidebar-item-name">#Tech</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stories Section -->
        <div id="stories" class="section">
            <h2 style="margin-bottom: 30px; font-size: 24px;">Meus Stories</h2>
            <div class="stories-grid" id="stories-grid">
                <!-- Stories aparecerão aqui -->
            </div>
        </div>

        <!-- Profile Section -->
        <div id="profile" class="section">
            <div class="profile-header">
                <div class="profile-avatar">V</div>
                <h2>Seu Perfil</h2>
                <p>@seu_usuario • Desenvolvedor Web</p>
                <p style="color: var(--text-secondary); font-size: 14px;">Apaixonado por tecnologia e design. Criando experiências incríveis na web.</p>
                
                <div class="profile-stats">
                    <div class="stat">
                        <div class="stat-number" id="profile-posts-count">0</div>
                        <div class="stat-label">Posts</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">1.2K</div>
                        <div class="stat-label">Seguidores</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">456</div>
                        <div class="stat-label">Seguindo</div>
                    </div>
                </div>

                <div class="profile-actions">
                    <button><i class="fas fa-edit"></i> Editar Perfil</button>
                    <button><i class="fas fa-cog"></i> Configurações</button>
                </div>
            </div>

            <h3 style="margin-bottom: 20px; font-size: 18px;">Seus Posts</h3>
            <div class="profile-posts" id="profile-posts">
                <!-- Posts do perfil aparecerão aqui -->
            </div>
        </div>
    </div>

    <!-- Story Viewer Modal -->
    <div class="story-viewer" id="storyViewer">
        <button class="story-viewer-close" onclick="closeStoryViewer()"><i class="fas fa-times"></i></button>
        <button class="story-viewer-nav prev" onclick="prevStory()"><i class="fas fa-chevron-left"></i></button>
        <div class="story-viewer-content" id="storyViewerContent">
            <i class="fas fa-image"></i>
        </div>
        <button class="story-viewer-nav next" onclick="nextStory()"><i class="fas fa-chevron-right"></i></button>
    </div>

    <script>
        // URLs de imagens aleatórias (Unsplash - similar ao Pinterest)
        const imageUrls = [
            'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=500&h=700&fit=crop',
            'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500&h=700&fit=crop',
            'https://images.unsplash.com/photo-1517694712202-cad84cf45f1d?w=500&h=700&fit=crop',
            'https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=500&h=700&fit=crop',
            'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500&h=700&fit=crop',
            'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=500&h=700&fit=crop',
            'https://images.unsplash.com/photo-1511379938547-c1f69b13d835?w=500&h=700&fit=crop',
            'https://images.unsplash.com/photo-1500295942863-6f3031224c94?w=500&h=700&fit=crop',
            'https://images.unsplash.com/photo-1514306688772-2c84f01e4675?w=500&h=700&fit=crop',
            'https://images.unsplash.com/photo-1506157786151-b8491531f063?w=500&h=700&fit=crop',
            'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500&h=700&fit=crop',
            'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=500&h=700&fit=crop',
            'https://images.unsplash.com/photo-1519904981063-b0cf448d479e?w=500&h=700&fit=crop',
            'https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=500&h=700&fit=crop',
            'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=500&h=700&fit=crop'
        ];

        function getRandomImage() {
            return imageUrls[Math.floor(Math.random() * imageUrls.length)];
        }

        const posts = [
            {
                id: 1,
                user: "João Silva",
                username: "joaosilva",
                avatar: "J",
                content: "Que dia lindo para programar! 🌞 Finalizando um novo projeto incrível.",
                likes: 245,
                liked: false,
                time: "há 2 horas",
                comments: 12,
                image: getRandomImage()
            },
            {
                id: 2,
                user: "Maria Oliveira",
                username: "mariaoliv",
                avatar: "M",
                content: "Novo design finalizado! O que vocês acham? 🎨 #design #webdesign",
                likes: 532,
                liked: false,
                time: "há 5 horas",
                comments: 28,
                image: getRandomImage()
            }
        ];

        const stories = [
            { id: 1, user: "João Silva", time: "há 1h", image: getRandomImage() },
            { id: 2, user: "Maria Oliveira", time: "há 2h", image: getRandomImage() },
            { id: 3, user: "Pedro Santos", time: "há 3h", image: getRandomImage() },
            { id: 4, user: "Ana Costa", time: "há 4h", image: getRandomImage() }
        ];

        let currentStoryIndex = 0;

        function switchSection(sectionId) {
            // Hide all sections
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });

            // Remove active class from all nav buttons
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected section
            document.getElementById(sectionId).classList.add('active');

            // Add active class to clicked button
            event.target.closest('.nav-btn').classList.add('active');

            // Render content based on section
            if (sectionId === 'feed') {
                renderFeed();
            } else if (sectionId === 'stories') {
                renderStories();
            } else if (sectionId === 'profile') {
                renderProfile();
            }
        }

        function renderFeed() {
            const feedPosts = document.getElementById('feed-posts');
            feedPosts.innerHTML = '';

            posts.sort((a, b) => b.id - a.id).forEach(post => {
                const postElement = document.createElement('div');
                postElement.className = 'post';
                postElement.innerHTML = `
                    <div class="post-header">
                        <div class="post-user">
                            <div class="post-avatar">${post.avatar}</div>
                            <div class="post-user-info">
                                <h3>${post.user}</h3>
                                <p>@${post.username} • ${post.time}</p>
                            </div>
                        </div>
                        <div class="post-menu">
                            <i class="fas fa-ellipsis-h"></i>
                        </div>
                    </div>

                    <div class="post-image" style="background-image: url('${post.image}');"></div>

                    <div class="post-actions">
                        <div class="action-group">
                            <button class="action-btn ${post.liked ? 'liked' : ''}" onclick="likePost(${post.id})">
                                <i class="fas fa-heart"></i>
                            </button>
                            <button class="action-btn"><i class="fas fa-comment"></i></button>
                            <button class="action-btn"><i class="fas fa-share"></i></button>
                        </div>
                        <button class="action-btn"><i class="fas fa-bookmark"></i></button>
                    </div>

                    <div class="post-stats">
                        <div class="likes">${post.likes} curtidas</div>
                        <div class="post-time">${post.comments} comentários</div>
                    </div>

                    <div class="post-content">
                        <strong>${post.user}</strong> ${post.content}
                    </div>

                    <div class="post-comments">
                        <div class="comment">
                            <strong>usuario1:</strong> Que legal! 😍
                        </div>
                        <div class="comment">
                            <strong>usuario2:</strong> Adorei! 🔥
                        </div>
                    </div>

                    <div class="comment-input">
                        <input type="text" placeholder="Adicione um comentário...">
                        <button>Enviar</button>
                    </div>
                `;
                feedPosts.appendChild(postElement);
            });
        }

        function renderStories() {
            const storiesGrid = document.getElementById('stories-grid');
            storiesGrid.innerHTML = '';

            stories.forEach((story, index) => {
                const storyCard = document.createElement('div');
                storyCard.className = 'story-card';
                storyCard.onclick = () => openStoryViewer(index);
                storyCard.innerHTML = `
                    <div class="story-image" style="background-image: url('${story.image}');"></div>
                    <div class="story-info">
                        <h4>${story.user}</h4>
                        <p>${story.time}</p>
                    </div>
                `;
                storiesGrid.appendChild(storyCard);
            });
        }

        function renderProfile() {
            document.getElementById('profile-posts-count').textContent = posts.length;
            
            const profilePosts = document.getElementById('profile-posts');
            profilePosts.innerHTML = '';

            posts.forEach(post => {
                const postCard = document.createElement('div');
                postCard.className = 'profile-post';
                postCard.style.backgroundImage = `url('${post.image}')`;
                profilePosts.appendChild(postCard);
            });
        }

        function addPost() {
            const input = document.getElementById('post-input');
            const content = input.value.trim();

            if (content) {
                const newPost = {
                    id: posts.length + 1,
                    user: "Você",
                    username: "seu_usuario",
                    avatar: "V",
                    content: content,
                    likes: 0,
                    liked: false,
                    time: "Agora mesmo",
                    comments: 0,
                    image: getRandomImage()
                };

                posts.push(newPost);
                input.value = '';
                renderFeed();
            } else {
                alert("Por favor, escreva algo antes de publicar!");
            }
        }

        function likePost(id) {
            const post = posts.find(p => p.id === id);
            if (post) {
                post.liked = !post.liked;
                post.likes += post.liked ? 1 : -1;
                renderFeed();
            }
        }

        function openStoryViewer(index) {
            currentStoryIndex = index;
            document.getElementById('storyViewer').classList.add('active');
            updateStoryViewer();
        }

        function closeStoryViewer() {
            document.getElementById('storyViewer').classList.remove('active');
        }

        function updateStoryViewer() {
            const story = stories[currentStoryIndex];
            const storyViewerContent = document.getElementById('storyViewerContent');
            storyViewerContent.style.backgroundImage = `url('${story.image}')`;
            storyViewerContent.innerHTML = `
                <div style="text-align: center; color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.5);
                    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); width: 100%; height: 100%;
                    display: flex; flex-direction: column; justify-content: flex-end; padding: 30px;">
                    <h3 style="margin: 0 0 5px 0;">${story.user}</h3>
                    <p style="margin: 0; font-size: 14px;">${story.time}</p>
                </div>
            `;
        }

        function nextStory() {
            currentStoryIndex = (currentStoryIndex + 1) % stories.length;
            updateStoryViewer();
        }

        function prevStory() {
            currentStoryIndex = (currentStoryIndex - 1 + stories.length) % stories.length;
            updateStoryViewer();
        }

        // Inicializar feed
        renderFeed();
    </script>
</body>
</html>
